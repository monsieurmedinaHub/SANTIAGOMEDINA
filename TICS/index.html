<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<title>TICS Aplicadas a la Enseñanza</title>

<style>
    body {
        font-family: Arial, sans-serif;
        background: #eef2f7;
        margin: 0;
        padding: 0;
    }

    header {
        background: #00296B;
        color: white;
        padding: 25px;
        text-align: center;
        border-bottom: 6px solid #C1121F;
    }

    header h1 {
        margin: 0;
        font-size: 26px;
        font-weight: bold;
    }

    .container {
        width: 90%;
        max-width: 700px;
        margin: 30px auto;
        background: white;
        padding: 25px;
        border-radius: 12px;
        text-align: center;
        border: 3px solid #00296B;
        box-shadow: 0px 4px 10px rgba(0,0,0,0.15);
    }

    button {
        background: #00296B;
        color: white;
        padding: 12px 20px;
        margin: 10px 0;
        border-radius: 10px;
        font-size: 18px;
        cursor: pointer;
        font-weight: bold;
        border: 3px solid #C1121F;
        transition: 0.3s;
        width: 100%;
    }

    button:hover {
        background: #C1121F;
        border-color: #00296B;
        transform: scale(1.03);
    }

    .volver {
        display: inline-block;
        background: #00296B;
        color: white;
        padding: 10px 15px;
        border-radius: 50%;
        font-size: 22px;
        text-decoration: none;
        font-weight: bold;
        border: 3px solid #C1121F;
        transition: 0.3s;
        margin-bottom: 20px;
    }

    .volver:hover {
        background: #C1121F;
        border-color: #00296B;
        transform: scale(1.1);
    }

    .question {
        font-size: 20px;
        margin: 15px 0;
        font-weight: bold;
    }

    .option {
        background: #f8f8f8;
        padding: 14px;
        margin: 10px 0;
        border-radius: 10px;
        cursor: pointer;
        border: 3px solid #ddd;
        font-size: 18px;
        transition: 0.25s;
        box-shadow: 0px 2px 4px rgba(0,0,0,0.15);
        text-align: left;
    }

    .option:hover {
        background: #e6e6e6;
        border-color: #00296B;
        transform: scale(1.02);
    }

    .selected {
        background: #C1121F;
        color: white;
        border-color: #00296B;
        box-shadow: 0px 4px 8px rgba(0,0,0,0.25);
        transform: scale(1.03);
    }

    #result {
        margin-top: 15px;
        font-size: 18px;
        font-weight: bold;
    }
</style>
</head>

<body>

<header>
    <h1>TICS Aplicadas a la Enseñanza</h1>
</header>

<div class="container">

    <a class="volver" href="../index.html">⬅</a>

    <button onclick="startIntro()">Introducción a las TICS</button>
    <button onclick="startTools()">Herramientas Digitales</button>
    <button onclick="startResources()">Recursos Educativos Digitales</button>
    <button onclick="startEvaluation()">Evaluación con TICS</button>
    <button onclick="startSecurity()">Seguridad Digital</button>
    <button onclick="startExam()">EXAM MODE (20 Questions)</button>

    <div id="exercise"></div>
    <div id="result"></div>
</div>

<script>
/* ------------------ INTRODUCCIÓN A LAS TICS ------------------ */
const introQuestions = [
    { q: "¿Qué significa TICS?", options: ["Tecnologías de la Información y la Comunicación", "Técnicas Integradas de Computación", "Tratamiento Informático y Comunicación Social"], answer: "Tecnologías de la Información y la Comunicación" },
    { q: "¿Cuál es un beneficio de las TICS en educación?", options: ["Aumentan la desinformación", "Facilitan el acceso al conocimiento", "Eliminan la interacción docente-estudiante"], answer: "Facilitan el acceso al conocimiento" },
    { q: "¿Qué competencia digital es esencial para un docente?", options: ["Saber programar videojuegos", "Saber usar herramientas digitales educativas", "Saber reparar computadores"], answer: "Saber usar herramientas digitales educativas" }
];

function startIntro() {
    loadExercise(introQuestions);
}

/* ------------------ HERRAMIENTAS DIGITALES ------------------ */
const toolsQuestions = [
    { q: "¿Cuál herramienta sirve para crear presentaciones interactivas?", options: ["Genially", "Classroom", "Padlet"], answer: "Genially" },
    { q: "¿Cuál herramienta permite gestionar clases virtuales?", options: ["Kahoot", "Google Classroom", "Canva"], answer: "Google Classroom" },
    { q: "¿Cuál herramienta sirve para crear evaluaciones gamificadas?", options: ["Kahoot", "Word", "Excel"], answer: "Kahoot" }
];

function startTools() {
    loadExercise(toolsQuestions);
}

/* ------------------ RECURSOS EDUCATIVOS DIGITALES ------------------ */
const resourcesQuestions = [
    { q: "¿Qué tipo de recurso se puede crear con Canva?", options: ["Infografías", "Bases de datos", "Sistemas operativos"], answer: "Infografías" },
    { q: "¿Qué herramienta permite crear videos educativos fácilmente?", options: ["PowerPoint", "Genially", "Paint"], answer: "PowerPoint" },
    { q: "¿Qué herramienta permite crear formularios de evaluación?", options: ["Google Forms", "Photoshop", "Audacity"], answer: "Google Forms" }
];

function startResources() {
    loadExercise(resourcesQuestions);
}

/* ------------------ EVALUACIÓN CON TICS ------------------ */
const evaluationQuestions = [
    { q: "¿Qué ventaja tiene la evaluación digital?", options: ["Retroalimentación inmediata", "Mayor dificultad para los estudiantes", "No permite calificar"], answer: "Retroalimentación inmediata" },
    { q: "¿Qué herramienta permite crear rúbricas digitales?", options: ["Excel", "Classroom", "Paint"], answer: "Classroom" },
    { q: "¿Qué herramienta permite crear exámenes automáticos?", options: ["Google Forms", "Word", "PowerPoint"], answer: "Google Forms" }
];

function startEvaluation() {
    loadExercise(evaluationQuestions);
}

/* ------------------ SEGURIDAD DIGITAL ------------------ */
const securityQuestions = [
    { q: "¿Qué es una buena práctica de seguridad digital?", options: ["Compartir contraseñas", "Usar contraseñas seguras", "Instalar software desconocido"], answer: "Usar contraseñas seguras" },
    { q: "¿Qué es phishing?", options: ["Un ataque para robar información", "Un programa educativo", "Una herramienta de diseño"], answer: "Un ataque para robar información" },
    { q: "¿Qué se debe evitar en internet?", options: ["Dar datos personales", "Usar antivirus", "Actualizar el sistema"], answer: "Dar datos personales" }
];

function startSecurity() {
    loadExercise(securityQuestions);
}

/* ------------------ EXAM MODE (20 QUESTIONS) ------------------ */
const examQuestions = [
    { q: "1. ¿Qué significa TICS?", A: "Tecnologías de la Información y la Comunicación", B: "Tratamiento Informático y Comunicación Social", C: "Técnicas Integradas de Computación", D: "Telecomunicaciones Internacionales", answer: "A" },
    { q: "2. ¿Cuál es una herramienta para presentaciones interactivas?", A: "Genially", B: "Excel", C: "Paint", D: "Audacity", answer: "A" },
    { q: "3. ¿Cuál herramienta gestiona clases virtuales?", A: "Kahoot", B: "Google Classroom", C: "Canva", D: "Word", answer: "B" },
    { q: "4. ¿Qué recurso se crea con Canva?", A: "Infografías", B: "Bases de datos", C: "Sistemas operativos", D: "Drivers", answer: "A" },
    { q: "5. ¿Qué herramienta crea formularios automáticos?", A: "Photoshop", B: "Google Forms", C: "Audacity", D: "Paint", answer: "B" },
    { q: "6. ¿Qué ventaja tiene la evaluación digital?", A: "Retroalimentación inmediata", B: "Mayor dificultad", C: "No permite calificar", D: "Elimina la interacción", answer: "A" },
    { q: "7. ¿Qué es phishing?", A: "Un ataque para robar información", B: "Una app educativa", C: "Un editor de video", D: "Un antivirus", answer: "A" },
    { q: "8. ¿Qué se debe evitar?", A: "Dar datos personales", B: "Usar antivirus", C: "Actualizar el sistema", D: "Usar contraseñas seguras", answer: "A" },
    { q: "9. ¿Qué herramienta permite crear rúbricas digitales?", A: "Classroom", B: "Paint", C: "Excel", D: "Word", answer: "A" },
    { q: "10. ¿Qué herramienta permite crear exámenes automáticos?", A: "Google Forms", B: "PowerPoint", C: "Photoshop", D: "Audacity", answer: "A" },
    { q: "11. ¿Qué competencia digital es esencial?", A: "Saber usar herramientas educativas", B: "Reparar computadores", C: "Programar videojuegos", D: "Instalar drivers", answer: "A" },
    { q: "12. ¿Qué herramienta permite gamificar evaluaciones?", A: "Kahoot", B: "Word", C: "Excel", D: "Paint", answer: "A" },
    { q: "13. ¿Qué herramienta permite crear videos educativos?", A: "PowerPoint", B: "Paint", C: "Excel", D: "Audacity", answer: "A" },
    { q: "14. ¿Qué herramienta permite crear presentaciones interactivas?", A: "Genially", B: "Photoshop", C: "Audacity", D: "Excel", answer: "A" },
    { q: "15. ¿Qué herramienta permite gestionar clases virtuales?", A: "Google Classroom", B: "Paint", C: "Excel", D: "Word", answer: "A" },
    { q: "16. ¿Qué es una buena práctica de seguridad digital?", A: "Usar contraseñas seguras", B: "Compartir contraseñas", C: "Instalar software desconocido", D: "Ignorar actualizaciones", answer: "A" },
    { q: "17. ¿Qué se debe evitar en internet?", A: "Dar datos personales", B: "Usar antivirus", C: "Actualizar el sistema", D: "Usar contraseñas seguras", answer: "A" },
    { q: "18. ¿Qué herramienta permite crear infografías?", A: "Canva", B: "Excel", C: "Paint", D: "Audacity", answer: "A" },
    { q: "19. ¿Qué herramienta permite crear formularios?", A: "Google Forms", B: "Photoshop", C: "Excel", D: "Paint", answer: "A" },
    { q: "20. ¿Qué ventaja tienen las TICS?", A: "Facilitan el acceso al conocimiento", B: "Eliminan la interacción", C: "Aumentan la desinformación", D: "Dificultan el aprendizaje", answer: "A" }
];

let examIndex = 0;
let score = 0;
let examFeedback = [];

function startExam() {
    examIndex = 0;
    score = 0;
    examFeedback = [];
    loadExamQuestion();
}

function loadExamQuestion() {
    const q = examQuestions[examIndex];
    document.getElementById("exercise").innerHTML = `
        <div class="question">${q.q}</div>
        <div class="option" onclick="checkExam('A')">A. ${q.A}</div>
        <div class="option" onclick="checkExam('B')">B. ${q.B}</div>
        <div class="option" onclick="checkExam('C')">C. ${q.C}</div>
        <div class="option" onclick="checkExam('D')">D. ${q.D}</div>
    `;
    document.getElementById("result").innerHTML = "";
}

function checkExam(selected) {
    const correct = examQuestions[examIndex].answer;
    let feedback = "";

    if (selected === correct) {
        score++;
        feedback = `✔️ Question ${examIndex + 1}: Correct`;
    } else {
        feedback = `❌ Question ${examIndex + 1}: Incorrect (Correct answer: ${correct})`;
    }

    examFeedback.push(feedback);

    examIndex++;
    if (examIndex < examQuestions.length) {
        loadExamQuestion();
    } else {
        showExamResults();
    }
}

function showExamResults() {
    const percentage = Math.round((score / examQuestions.length) * 100);

    document.getElementById("exercise").innerHTML = "";
    document.getElementById("result").innerHTML = `
        <h3>EXAM FINISHED</h3>
        <p>Score: ${score} / 20</p>
        <p>Percentage: ${percentage}%</p>
        <button onclick="downloadResults()">Download Results</button>
    `;
}

function downloadResults() {
    const percentage = Math.round((score / examQuestions.length) * 100);
    let text = `TICS Exam Results\n\nScore: ${score}/20\nPercentage: ${percentage}%\n\nDetailed Feedback:\n\n`;
    text += examFeedback.join("\n");

    const blob = new Blob([text], { type: "text/plain" });
    const url = URL.createObjectURL(blob);

    const a = document.createElement("a");
    a.href = url;
    a.download = "tics_exam_results.txt";
    a.click();

    URL.revokeObjectURL(url);
}

/* ------------------ ENGINE FOR PRACTICE ------------------ */
function loadExercise(list) {
    const random = list[Math.floor(Math.random() * list.length)];
    const exerciseDiv = document.getElementById("exercise");
    const resultDiv = document.getElementById("result");

    resultDiv.innerHTML = "";

    exerciseDiv.innerHTML = `
        <div class="question">${random.q}</div>
        ${random.options.map(opt => `
            <div class="option" onclick="checkAnswer('${opt}', '${random.answer}')">${opt}</div>
        `).join("")}
    `;
}

function checkAnswer(selected, correct) {
    const resultDiv = document.getElementById("result");
    if (selected === correct) {
        resultDiv.innerHTML = "✔️ Correct!";
        resultDiv.style.color = "green";
    } else {
        resultDiv.innerHTML = "❌ Incorrect. Correct answer: " + correct;
        resultDiv.style.color = "red";
    }
}
</script>

</body>
</html>
